name: Publish to PyPI

# Runs only when a GitHub Release is published. Pushing commits does not publish.
on:
  release:
    types: [published]

permissions: {}

# Never run two uploads of the same release at once, and never cancel one mid-upload.
concurrency:
  group: pypi-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  # If any test or type check fails, the build and upload below are skipped.
  tests:
    name: Tests
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read

  build:
    name: Build package
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Build the sdist and wheel
        run: |
          python -m pip install build==1.6.1
          python -m build

      - name: Check the wheel imports and matches the release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python -m pip install --no-deps dist/*.whl
          built="$(python -c 'import primitives; from importlib.metadata import version; print(version("py-prim"))')"
          if [ "${RELEASE_TAG#v}" != "$built" ]; then
            echo "::error::Release tag $RELEASE_TAG does not match package version $built"
            exit 1
          fi

      - name: Store the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # The environment name and this file's name must match the Trusted Publisher on PyPI.
    environment:
      name: pypi
      url: https://pypi.org/p/py-prim
    permissions:
      id-token: write # Lets PyPI verify this workflow, with no stored token.
    steps:
      - name: Download the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Upload to PyPI with provenance
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
