name: Tests

on:
  push:
    branches: [main]
  pull_request:
  # Lets release.yml run these same checks before it publishes.
  workflow_call:

permissions: {}

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # GitHub only offers Python 3.7 on this older runner.
          - os: ubuntu-22.04
            python-version: "3.7"
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package and test tools
        run: python -m pip install ".[test]"

      - name: Run the tests
        run: python -m pytest

  typecheck:
    name: Type check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install the package and mypy
        run: python -m pip install . mypy==2.3.1

      - name: Check the library
        run: python -m mypy --strict src/primitives

      - name: Check the type hints as a package user sees them
        run: python -m mypy --strict tests/typing_checks.py
