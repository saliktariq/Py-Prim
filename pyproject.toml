[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "py-prim"
version = "0.2.0"
description = "Enhanced and validated base primitive data types for Python."
readme = "README.md"
authors = [{ name="Salik Tariq" }]
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[tool.setuptools.package-data]
primitives = ["py.typed"]
